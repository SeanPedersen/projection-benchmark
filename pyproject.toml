[project]
name = "drbench"
version = "0.1.0"
description = "Benchmark of dimensionality reduction implementations: quality (local/global) vs time and memory."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "numba>=0.60",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "niquests>=3.9",
    "umap-learn>=0.5.7",
    "opentsne>=1.0.2",
    "manifolds-rs>=0.6.1",
    "ncvis>=1.5.13",
    "ncvis-plus>=0.1.0",
    "rinnd>=0.3.1",
]

[project.scripts]
drbench = "drbench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.extra-build-dependencies]
ncvis = ["numpy", "cython", "pybind11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

# ncvis 1.5.13 (sdist-only, 2023) fails to cythonize against NumPy 2; vendored with a one-line cast fix.
[tool.uv.sources]
ncvis = { path = "vendor/ncvis" }
# NCVis+ (fork with PCA init, retuned defaults and a faster kernel) is not on PyPI yet.
ncvis-plus = { git = "https://github.com/SeanPedersen/ncvis-plus", rev = "2f77016" }
